name: Validate upstream-clean NumPy e-means labels

on:
  push:
    branches:
      - ci/e-means-upstream-clean-smoke
    paths:
      - ".github/workflows/e-means-upstream-clean-smoke.yml"
      - "contrib/e_means/e_means.py"
      - "contrib/e_means/README.md"
      - "tests/test_e_means_labels_out.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-clean-python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install compiled FAISS CPU and NumPy
        run: python -m pip install numpy==2.3.5 faiss-cpu==1.15.1
      - name: Use exact checked-out e-means Python sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          import faiss
          target = Path(faiss.__file__).resolve().parent / "contrib" / "e_means"
          shutil.copytree("contrib/e_means", target, dirs_exist_ok=True)
          print("Overlayed checked-out sources at", target)
          PY
      - name: New public labels API regressions
        run: |
          python -m unittest discover -s tests \
            -p 'test_e_means_labels_out.py' -v
      - name: All existing NumPy e-means regressions
        run: |
          python -m unittest discover -s tests \
            -p 'test_e_means.py' -v
