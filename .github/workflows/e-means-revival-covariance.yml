name: E-means revival frame audit

on:
  pull_request:
    paths:
      - "benchs/e_means/revival_frame_audit.py"
      - "benchs/e_means/revival_quality_control.py"
      - "benchs/e_means/REVIVAL_COVARIANCE.md"
      - "benchs/e_means/REVIVAL_QUALITY_PREREG.md"
      - ".github/workflows/e-means-revival-covariance.yml"
  push:
    branches:
      - "research/e-means-revival-covariance"
    paths:
      - "benchs/e_means/revival_frame_audit.py"
      - "benchs/e_means/revival_quality_control.py"
      - "benchs/e_means/REVIVAL_COVARIANCE.md"
      - "benchs/e_means/REVIVAL_QUALITY_PREREG.md"
      - ".github/workflows/e-means-revival-covariance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numpy-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install NumPy
        run: python -m pip install numpy==2.3.5
      - name: Check standalone regression with proper failure exit
        run: python benchs/e_means/revival_frame_audit.py --tests
      - name: Emit reproducible numerical evidence
        run: python benchs/e_means/revival_frame_audit.py

  faiss-numpy-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install compiled FAISS core and NumPy
        run: python -m pip install numpy==2.3.5 faiss-cpu==1.15.1
      - name: Use current checked-out e-means sources with compiled core
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          import faiss

          installed = Path(faiss.__file__).resolve().parent / "contrib" / "e_means"
          shutil.copytree("contrib/e_means", installed, dirs_exist_ok=True)
          print("Installed e-means from checked-out commit at", installed)
          PY
      - name: Require actual FAISS source parity
        run: |
          python benchs/e_means/revival_frame_audit.py --faiss
          python benchs/e_means/revival_frame_audit.py --tests

  quality-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install NumPy
        run: python -m pip install numpy==2.3.5
      - name: Run pre-registered holdout quality control
        run: python benchs/e_means/revival_quality_control.py --output stage4-results.json
      - name: Preserve all per-seed outcomes
        uses: actions/upload-artifact@v4
        with:
          name: e-means-revival-quality-stage4
          path: stage4-results.json
          retention-days: 30
