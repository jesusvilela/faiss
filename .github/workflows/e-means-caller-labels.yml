name: NumPy e-means caller-owned labels

on:
  pull_request:
    paths:
      - "contrib/e_means/e_means.py"
      - "contrib/e_means/README.md"
      - "tests/test_e_means_labels_out.py"
      - ".github/workflows/e-means-caller-labels.yml"
  push:
    branches:
      - "feature/e-means-caller-labels"
    paths:
      - "contrib/e_means/e_means.py"
      - "contrib/e_means/README.md"
      - "tests/test_e_means_labels_out.py"
      - ".github/workflows/e-means-caller-labels.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numpy-caller-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install NumPy and compiled FAISS CPU
        run: python -m pip install numpy==2.3.5 faiss-cpu==1.15.1
      - name: Use checked-out e-means Python source
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          import faiss
          installed = Path(faiss.__file__).resolve().parent / "contrib" / "e_means"
          shutil.copytree("contrib/e_means", installed, dirs_exist_ok=True)
          print("Loaded checked-out source into", installed)
          PY
      - name: Run caller-owned labels regression tests
        run: python -m unittest discover -s tests -p 'test_e_means_labels_out.py' -v
      - name: Keep existing caller-driven lifecycle regression
        run: |
          python -m unittest discover -s tests -p 'test_e_means.py' -k test_caller_batches_match_matrix_training -v
          python -m unittest discover -s tests -p 'test_e_means.py' -k test_revival_starts_on_fifth_update -v
