# TEMPORARY DIAGNOSTIC ONLY -- DO NOT MERGE THIS OVERRIDE.
# Removes all upstream reusable calls temporarily and launches
# a lightweight canary to isolate workflow graph startup failure.
name: Build
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'
jobs:
  fork-bootstrap-canary:
    name: Fork startup control
    runs-on: ubuntu-latest
    steps:
      - name: Print runner receipt
        run: echo 'Build reached a GitHub-hosted runner in the diagnostic branch'
  build-pip:
    if: ${{ false }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build-pip.yml
